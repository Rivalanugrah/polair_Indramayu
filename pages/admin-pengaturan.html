<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Akun - Admin POLAIR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body data-page="pengaturan" data-title="Pengaturan Akun">

  <div class="admin-container">
    <div id="admin-sidebar-mount"></div>

    <main class="admin-main">
      <div id="admin-topbar-mount"></div>

      <section class="admin-content">

        <!-- ============ DAFTAR AKUN ADMIN ============ -->
        <div class="admin-card">
          <div class="card-header">
            <h4><i class="fas fa-users"></i> Daftar Akun Admin</h4>
          </div>
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>No</th>
                  <th>Username</th>
                  <th>Tanggal Dibuat</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="adminListBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../assets/js/db.js?v=20260920"></script>
  <script src="../assets/js/auth.js?v=20260920"></script>
  <script src="../assets/js/admin-shell.js?v=20260920"></script>
  <script src="../assets/js/db.js?v=20260920"></script>
  <script src="../assets/js/auth.js?v=20260920"></script>
  <script src="../assets/js/admin-shell.js?v=20260920"></script>
  <script>
    // ── Inisialisasi ──
    document.addEventListener('DOMContentLoaded', function () {
      renderAdminList();
    });

    // ── Render Daftar Akun Admin ──
    function renderAdminList() {
      const tbody = document.getElementById('adminListBody');
      if (!tbody) return;
      
      const admins = AdminStore.all();
      const currentUser = authCurrentUser();

      // Tampilkan juga akun default sebagai baris pertama
      const defaultCred = authGetCredentials();
      let allAccounts = [
        { id: 'default', username: defaultCred.username, isDefault: true, createdAt: null }
      ];

      // Tambahkan akun tambahan dari AdminStore
      admins.forEach(a => {
        allAccounts.push({ id: a.id, username: a.username, isDefault: false, createdAt: a.createdAt });
      });

      if (allAccounts.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4"><i class="fas fa-users" style="font-size:1.4rem;display:block;margin-bottom:8px;"></i>Belum ada akun.</td></tr>';
        return;
      }

      tbody.innerHTML = allAccounts.map((acc, i) => {
        const isCurrentUser = acc.username === currentUser?.username;
        const tanggal = acc.createdAt ? formatTanggalID(acc.createdAt) : 'Akun Default';
        return `
          <tr>
            <td>${i + 1}</td>
            <td>
              ${acc.username}
              ${acc.isDefault ? '<span class="badge badge-info" style="margin-left:8px;font-size:0.7rem;">Default</span>' : ''}
              ${isCurrentUser ? '<span class="badge badge-success" style="margin-left:8px;font-size:0.7rem;">Anda</span>' : ''}
            </td>
            <td>${tanggal}</td>
            <td style="min-width:100px;">
              <div class="action-wrapper">
                ${!acc.isDefault ? `<button class="btn-delete" onclick="deleteAdmin('${acc.id}', '${acc.username}')" title="Hapus Akun"><i class="fas fa-trash"></i></button>` : '<span style="color:var(--text-muted);font-size:0.8rem;">Tidak dapat dihapus</span>'}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // ── Hapus Akun Admin ──
    function deleteAdmin(id, username) {
      if (confirm('Hapus akun admin "' + username + '"? Akun ini tidak akan bisa login lagi.')) {
        AdminStore.remove(id);
        renderAdminList(); // Refresh tabel
      }
    }
  </script>
</body>

</html>
