<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapor Darurat - Admin POLAIR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    body { background: var(--dark); }

    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-tab {
      padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.82rem; font-weight: 600;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary);
      cursor: pointer; transition: var(--transition);
    }
    .filter-tab.active, .filter-tab:hover { border-color: var(--accent); color: var(--white); background: rgba(0,180,216,0.12); }

    /* Action buttons wrapper - Flexbox horizontal alignment */
    .action-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    /* Uniform button sizing for aksi column */
    .action-wrapper .btn-view,
    .action-wrapper .btn-delete {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      border-radius: 6px;
    }
    .action-wrapper .btn-view i,
    .action-wrapper .btn-delete i {
      margin: 0;
    }
  </style>
</head>

<body data-page="lapor" data-title="Layanan Aduan Warga">

  <div class="admin-container">
    <div id="admin-sidebar-mount"></div>

    <main class="admin-main">
      <div id="admin-topbar-mount"></div>

      <section class="admin-content">
        <div class="admin-card">
          <div class="card-header">
            <h4><i class="fas fa-triangle-exclamation"></i> Daftar Laporan Darurat Terbaru</h4>
            <button class="btn-action" onclick="renderTable()"><i class="fas fa-sync-alt"></i> Segarkan Data</button>
          </div>

          <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab active" data-filter="semua" onclick="setFilter('semua')">Semua</button>
            <button class="filter-tab" data-filter="menunggu" onclick="setFilter('menunggu')">Menunggu Tim</button>
            <button class="filter-tab" data-filter="proses" onclick="setFilter('proses')">Dalam Proses</button>
            <button class="filter-tab" data-filter="selesai" onclick="setFilter('selesai')">Selesai / Aman</button>
          </div>

          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width:50px; text-align:center;">No</th>
                  <th>Tanggal & Waktu</th>
                  <th>Nama Pelapor</th>
                  <th>Kategori Insiden</th>
                  <th>Lokasi / Perairan</th>
                  <th>Status</th>
                  <th style="width:100px; text-align:center;">Aksi</th>
                </tr>
              </thead>
              <tbody id="laporBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../assets/js/db.js?v=20260920"></script>
  <script src="../assets/js/auth.js?v=20260920"></script>
  <script src="../assets/js/admin-shell.js?v=20260920"></script>
  <script>
    let currentFilter = 'semua';

    document.addEventListener('DOMContentLoaded', renderTable);

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === f);
      });
      renderTable();
    }

    function renderTable() {
      let data = LaporanStore.all();
      if (currentFilter !== 'semua') {
        data = data.filter(l => l.status === currentFilter);
      }

      const tbody = document.getElementById('laporBody');

      if (data.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7"><i class="fas fa-inbox" style="font-size:1.6rem;display:block;margin-bottom:8px;"></i>Belum ada laporan pada kategori ini.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((l, i) => {
        const meta = LaporanStore.statusMeta(l.status);
        return `
          <tr>
            <td>${i + 1}</td>
            <td>${formatTanggalID(l.createdAt)}</td>
            <td>${l.nama}</td>
            <td>${l.kategori}</td>
            <td>${l.lokasi}</td>
            <td><span class="badge ${meta.badgeClass}"><i class="fas ${meta.icon}"></i> ${meta.label}</span></td>
            <td>
              <div class="action-wrapper">
                <a href="admin-lapor-detail.html?id=${l.id}" class="btn-view" title="Lihat Detail">
                  <i class="fas fa-search"></i>
                </a>
                <button class="btn-delete" onclick="hapusLaporan('${l.id}', '${l.nama.replace(/'/g, "\\'")}')" title="Hapus">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function hapusLaporan(id, nama) {
      if (confirm(`Hapus laporan dari "${nama}"? Tindakan ini tidak bisa dibatalkan.`)) {
        LaporanStore.remove(id);
        renderTable();
      }
    }
  </script>
</body>

</html>
